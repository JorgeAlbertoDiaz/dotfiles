[main]
font=JetBrainsMono Nerd Font:size=12
pad=8x8
# Forzar el tema oscuro para que foot use siempre [colors-dark] (badwolf).
initial-color-theme=dark

[scrollback]
lines=10000

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

[colors-dark]
# Paleta badwolf (sjl/badwolf). Los ANSI se derivan de los grupos reales del
# colorscheme: red=taffy, green=lime, yellow=toffee, blue=tardis, magenta=dress,
# cyan=saltwatertaffy. badwolf no define un cyan propio, por eso cyan (#8cffba)
# comparte valor con bright-green.
background=1c1b1a
foreground=f8f6f2
regular0=141413
regular1=ff2c4b
regular2=aeee00
regular3=b88853
regular4=0a9dff
regular5=ff9eb8
regular6=8cffba
regular7=d9cec3
bright0=666462
bright1=ff2c4b
bright2=8cffba
bright3=f4cf86
bright4=0a9dff
bright5=ff9eb8
bright6=8cffba
bright7=ffffff
# cursor = <texto> <cursor>: texto oscuro sobre cursor tardis.
cursor=1c1b1a 0a9dff
selection-foreground=1c1b1a
selection-background=45413b