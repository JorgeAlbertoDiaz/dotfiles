[main]
font=JetBrainsMono Nerd Font:size=12
pad=8x8
# Tema de foot: lo elige scripts/sway-theme.sh reescribiendo ESTA línea.
# Las dos paletas conviven abajo ([colors-dark] y [colors-light]), así que no
# hay archivos duplicados: cambiar de tema es cambiar este valor.
#   dark  → [colors-dark]  (rust-dark)
#   light → [colors-light] (rust-light)
# Las ventanas YA abiertas cambian en vivo: el toggle manda SIGUSR1/SIGUSR2.
initial-color-theme=dark

[scrollback]
lines=10000

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

[colors-dark]
# Tema rust de mdbook, modo oscuro. Base: bg hsl(60,5%,16%) = 2b2b27,
# fg #cecece, superficie #33322e, acento #e69f67, azul #4ea8d6.
# Los ANSI no vienen del CSS (mdbook define 5 colores, no 16): se derivan con
# el mismo criterio cálido del tema, cuidando el contraste sobre 2b2b27.
background=2b2b27
# Transparencia: 0.0 = totalmente transparente, 1.0 = opaco. 0.90 = 90% opaco
# (sway compone la ventana). Ajustá el valor a gusto.
alpha=1.00
foreground=cecece
regular0=1a1a1a
regular1=c8553d
regular2=7f9a5b
regular3=c99a4e
regular4=4ea8d6
regular5=b07a8e
regular6=6fa8a0
regular7=cecece
bright0=5e5e56
bright1=e06c3a
bright2=9dbb74
bright3=e6c07a
bright4=7cc4e8
bright5=c99aae
bright6=93c7bf
bright7=ffffff
# cursor = <texto> <cursor>: texto del fondo sobre cursor azul del tema.
cursor=2b2b27 4ea8d6
selection-foreground=2b2b27
selection-background=5e5e56

[colors-light]
# Tema rust de mdbook, modo claro: las variables --bg hsl(60,9%,87%) = e1e1db,
# --fg #262625, --links #2b79a2, --blockquote-caution-color #aa1721,
# --blockquote-important-color #8250df, --table-header-bg #b3a497 y
# --sidebar-header-border-color #8c391f.
# Los ANSI oscurecen los mismos tonos para que se lean sobre fondo claro; en un
# terminal claro "bright white" es el texto más oscuro del tema (262625).
background=e1e1db
alpha=1.00
foreground=262625
regular0=262625
regular1=aa1721
regular2=4f6b33
regular3=8a6a2f
regular4=2b79a2
regular5=8250df
regular6=2f7a72
regular7=85857c
bright0=6e6b5e
bright1=8c391f
bright2=5f7f3f
bright3=a07f3c
bright4=1f6390
bright5=93687c
bright6=3a8f86
bright7=262625
cursor=e1e1db 2b79a2
selection-foreground=262625
selection-background=b3a497
