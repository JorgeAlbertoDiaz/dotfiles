# tmux — tema CLARO (rust-light).
#
# Este archivo lo elige scripts/sway-theme.sh: ~/.config/tmux/tmux.conf es un
# enlace simbólico a themes/dark.conf o themes/light.conf. tmux lee el archivo
# al arrancar y cada servidor ya abierto lo relee con `tmux source-file` (lo hace
# el propio script al cambiar de tema).
#
# Paleta del tema rust (mdbook), modo claro. La barra de estado es chrome:
# --sidebar-bg #3B2E2A de fondo, --sidebar-fg #C8C9DB de texto, la ventana
# activa se rellena con el acento #E69F67 y su texto va en --fg #262625. Los
# bordes de panel viven sobre el documento claro (#E1E1DB), así que usan
# --inline-code-color #6E6B5E y --links #2B79A2, que sí tienen contraste ahí.

set -g status-style "bg=#3b2e2a,fg=#c8c9db"

# Izquierda: sesión activa con el relleno naranja. Derecha: hora en un chip y
# fecha sobre el borde de popup del tema.
set -g status-left "#[bg=#e69f67,fg=#262625,bold] #S #[default] "
set -g status-right "#[bg=#45373a,fg=#c8c9db] %H:%M #[bg=#b38f6b,fg=#262625] %d/%m "
set -g status-left-length 24
set -g status-right-length 40

# Ventanas: inactivas atenuadas sobre el chrome, activa con el acento.
set -g window-status-format " #I:#W "
set -g window-status-style "fg=#b3a497,bg=#3b2e2a"
set -g window-status-current-style "fg=#262625,bg=#e69f67,bold"
set -g window-status-activity-style "fg=#262625,bg=#b3a497"
set -g window-status-bell-style "fg=#e1e1db,bg=#aa1721"

# Mensajes y línea de comandos: un escalón más claros que la barra.
set -g message-style "bg=#45373a,fg=#c8c9db"
set -g message-command-style "bg=#45373a,fg=#e69f67"

# Bordes de panel sobre el documento claro.
set -g pane-border-style "fg=#6e6b5e"
set -g pane-active-border-style "fg=#2b79a2"

# Modo copia/selección dentro de un panel claro.
set -g mode-style "bg=#e69f67,fg=#262625"
set -g clock-mode-colour "#2b79a2"
