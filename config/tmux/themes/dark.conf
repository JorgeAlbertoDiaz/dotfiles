# tmux — tema OSCURO (rust-dark).
#
# Este archivo lo elige scripts/sway-theme.sh: ~/.config/tmux/tmux.conf es un
# enlace simbólico a themes/dark.conf o themes/light.conf. tmux lee el archivo
# al arrancar y cada servidor ya abierto lo relee con `tmux source-file` (lo hace
# el propio script al cambiar de tema).
#
# Paleta del tema rust (mdbook), modo oscuro: bg #2b2b27, superficie #33322e,
# alterna #3b3b37, fg #cecece, atenuado #8a8b99, acento #e69f67, azul #4ea8d6.
# Misma estructura de roles que light.conf.

set -g status-style "bg=#2b2b27,fg=#cecece"

set -g status-left "#[bg=#e69f67,fg=#2b2b27,bold] #S #[default] "
set -g status-right "#[bg=#33322e,fg=#cecece] %H:%M #[bg=#5e5e56,fg=#cecece] %d/%m "
set -g status-left-length 24
set -g status-right-length 40

set -g window-status-format " #I:#W "
set -g window-status-style "fg=#8a8b99,bg=#2b2b27"
set -g window-status-current-style "fg=#2b2b27,bg=#e69f67,bold"
set -g window-status-activity-style "fg=#2b2b27,bg=#8a8b99"
set -g window-status-bell-style "fg=#cecece,bg=#e06c3a"

set -g message-style "bg=#33322e,fg=#cecece"
set -g message-command-style "bg=#33322e,fg=#e69f67"

set -g pane-border-style "fg=#5e5e56"
set -g pane-active-border-style "fg=#4ea8d6"

set -g mode-style "bg=#e69f67,fg=#2b2b27"
set -g clock-mode-colour "#4ea8d6"
