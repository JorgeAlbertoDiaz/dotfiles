# Herdr — tema CLARO (rust-light).
#
# scripts/sway-theme.sh hace que ~/.config/herdr/config.toml sea un enlace
# simbólico a este archivo (o a themes/dark.toml). No edites el enlace: cambiá
# acá y corré `sway-theme.sh light`.
#
# Por qué `name = "terminal"` y no un tema claro con nombre propio: así el área
# de paneles (el "documento") toma el fondo ANSI de foot —la paleta rust:
# #E1E1DB con texto #262625— y el chrome de herdr queda igual que el resto del
# escritorio.
#
# El chrome va con la paleta rust en su versión oscura, igual que la barra de
# waybar, el centro de notificaciones y el launcher:
#
#   sidebar_bg    --sidebar-bg #3B2E2A  (sidebar de spaces/agents)
#   panel_bg      --sidebar-bg #3B2E2A  (paneles flotantes y menús)
#   active_row_bg --sidebar-spacer #45373A  (fila activa, 6.90 de contraste)
#   selection_bg  --sidebar-non-existant #505254  (cursor de Navegar)
#   surface0      --sidebar-spacer #45373A  (tabs inactivas)
#   surface1      --sidebar-bg #3B2E2A
#   surface_dim   --sidebar-non-existant #505254
#   text          --sidebar-fg #C8C9DB  (7.97 sobre el sidebar: se lee)
#   subtext0      --table-header-bg #B3A497  (texto secundario, 5.39)
#   overlay0      --table-header-bg #B3A497
#   overlay1      --sidebar-fg #C8C9DB
#
# Los tokens de texto de herdr son globales (no hay un "sidebar fg" aparte): si
# el chrome es oscuro, `text` tiene que ser claro. Eso es seguro porque el
# documento sigue siendo claro: los paneles son ANSI de foot, no `text`.
#
# `red`, `green`, `yellow`, `blue`, `teal`, `mauve` y `peach` NO se pisan: son
# los estados de agente y ya vienen legibles del ANSI de foot, que es la paleta
# rust (la tab activa sale de ahí, en --links #2B79A2).
onboarding = false

[theme]
name = "terminal"
auto_switch = false

[theme.custom]
sidebar_bg = "#3b2e2a"
panel_bg = "#3b2e2a"
active_row_bg = "#45373a"
selection_bg = "#505254"
surface0 = "#45373a"
surface1 = "#3b2e2a"
surface_dim = "#505254"
text = "#c8c9db"
subtext0 = "#b3a497"
overlay0 = "#b3a497"
overlay1 = "#c8c9db"
