# Tema CLARO (rust-light) del OSD de volumen/brillo (wob).
#
# Este archivo lo elige scripts/sway-theme.sh: ~/.config/wob/wob.ini es un
# enlace simbólico a themes/dark.ini o themes/light.ini. El wob que corre
# (`tail -f $SWAYSOCK.wob | wob --config ~/.config/wob/wob.ini`, en
# features/autostart.conf) reaparece con los colores nuevos al recargar sway.
#
# Colores = <rrggbb[aa]> SIN '#'.
#
# El OSD es un panel flotante sobre el escritorio, así que usa el chrome del
# tema rust: fondo --sidebar-bg #3B2E2A translúcido, borde
# --theme-popup-border #B38F6B y barra con el acento --sidebar-active #E69F67.

timeout = 1000
height = 32
border_offset = 0
border_size = 2
bar_padding = 2

border_color = B38F6BCC
background_color = 3B2E2ACC
bar_color = E69F67FF
# Desborde (volumen con boost > 100): el rojo del tema (#AA1721) no se lee
# sobre chrome, se usa --warning-border #FF8E00.
overflow_border_color = FF8E00CC
overflow_background_color = 3B2E2ACC
overflow_bar_color = FF8E00FF
