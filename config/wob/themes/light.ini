# Tema CLARO (rust-light) del OSD de volumen/brillo (wob).
#
# Este archivo lo elige scripts/sway-theme.sh: ~/.config/wob/wob.ini es un
# enlace simbólico a themes/dark.ini o themes/light.ini. El wob que corre
# (`tail -f $SWAYSOCK.wob | wob --config ~/.config/wob/wob.ini`, en
# features/autostart.conf) reaparece con los colores nuevos al recargar sway.
#
# Colores = <rrggbb[aa]> SIN '#'.

timeout = 1000
height = 32
border_offset = 0
border_size = 2
bar_padding = 2

# Barra naranja del tema sobre fondo claro translúcido; el borde usa el tan
# del tema (el naranja sobre fondo claro pierde contraste como línea fina).
border_color = B38F6BB3
background_color = E1E1DBCC
bar_color = E69F67FF
# Desborde (volumen con boost > 100): rojo óxido oscuro.
overflow_border_color = B7410EB3
overflow_background_color = E1E1DBCC
overflow_bar_color = B7410EFF
