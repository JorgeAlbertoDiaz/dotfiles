# Tema OSCURO (rust-dark) del OSD de volumen/brillo (wob).
#
# Este archivo lo elige scripts/sway-theme.sh: ~/.config/wob/wob.ini es un
# enlace simbólico a themes/dark.ini o themes/light.ini. El wob que corre
# (`tail -f $SWAYSOCK.wob | wob --config ~/.config/wob/wob.ini`, en
# features/autostart.conf) reaparece con los colores nuevos al recargar sway.
#
# Colores = <rrggbb[aa]> SIN '#'.

timeout = 1000
height = 32
border_offset = 0
border_size = 2
bar_padding = 2

# Barra naranja del tema sobre fondo oscuro translúcido; el borde usa el
# tan del tema (rol "borde destacado" en oscuro), igual que en claro.
border_color = 8C6A4AB3
background_color = 2B2B27CC
bar_color = E69F67FF
# Desborde (volumen con boost > 100): rojo óxido.
overflow_border_color = E06C3AB3
overflow_background_color = 2B2B27CC
overflow_bar_color = E06C3AFF
