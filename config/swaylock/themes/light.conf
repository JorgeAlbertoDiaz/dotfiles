# Tema CLARO (rust-light) de swaylock.
#
# Este archivo lo elige scripts/sway-theme.sh: ~/.config/swaylock/config es un
# enlace simbólico a themes/dark.conf o themes/light.conf. No edites el enlace:
# cambiá acá (o corré `sway-theme.sh dark|light|toggle`). swaylock lee el
# archivo al bloquear, así que el próximo bloqueo ya usa el tema nuevo.
#
# La IMAGEN de fondo la decide scripts/swaylock-current.sh (usa la misma que
# eligió azote); el `image=` de acá es sólo el respaldo si corrés swaylock
# directo. Si cambiás la imagen del respaldo, cambiala en los DOS temas.
#
# Colores = <rrggbb[aa]>. La caja de contraseña es un panel flotante, así que
# usa el chrome del tema rust: --sidebar-bg #3b2e2a translúcido, texto
# --sidebar-fg #c8c9db, anillo/acento --sidebar-active #e69f67 y
# --warning-border #ff8e00 para error (el rojo del tema no se lee sobre chrome).

daemonize
ignore-empty-password
show-failed-attempts
show-keyboard-layout
line-uses-ring
indicator-caps-lock

image=/usr/share/wallpapers/openSUSEdefault/contents/images/default-dark.png

inside-color=3b2e2acc
inside-ver-color=45373acc
inside-wrong-color=45373acc
inside-clear-color=45373acc
ring-color=e69f67ff
ring-ver-color=e69f67ff
ring-wrong-color=ff8e00ff
ring-clear-color=c8c9dbff
key-hl-color=e69f67ff
bs-hl-color=ff8e00ff
separator-color=c8c9db4d
text-color=c8c9dbff
text-ver-color=c8c9dbff
text-wrong-color=ff8e00ff
text-clear-color=c8c9dbff
line-ver-color=e69f67ff
line-wrong-color=ff8e00ff
line-clear-color=c8c9dbff
