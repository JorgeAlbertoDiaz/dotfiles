# PATH del usuario para la sesión gráfica (systemd --user + sway).
#
# sway-run.sh importa environment.d antes de arrancar sway, así que esto es lo
# que heredan sway, foot, wofi y todo lo que se lance desde ellos. Ojo:
# environment.d REEMPLAZA la variable completa, no la extiende; por eso la
# lista es explícita. Si faltara, la sesión gráfica se queda sin brew, pi y
# gentle-ai aunque los shells interactivos sí los encuentren.
#
#   /home/linuxbrew/.linuxbrew/{bin,sbin}  brew, gentle-ai, engram
#   ~/.gentle-ai/bin                       wrapper de opencode (define
#                                          OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS);
#                                          va antes que ~/.opencode/bin
#   ~/.pi/agent/bin                        instalación administrada de pi
#   ~/.local/bin                           symlinks de pi y gentle-shell
#   ~/.opencode/bin                        opencode
#
# ${HOME} se expande (el generador de systemd resuelve variables ya definidas).
PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:${HOME}/.gentle-ai/bin:${HOME}/.pi/agent/bin:${HOME}/.local/bin:${HOME}/.opencode/bin:/usr/local/bin:/usr/bin:/bin
# Prefijo de Homebrew explícito para los procesos que no pasan por el shell.
HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew
HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar
HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew
