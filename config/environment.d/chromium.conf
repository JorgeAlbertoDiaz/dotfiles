# Chromium nativo en Wayland. No depende de XWayland, que puede caerse y
# dejar DISPLAY muerto (error "Missing X server or $DISPLAY"). Igual que
# MOZ_ENABLE_WAYLAND fija Firefox a Wayland nativo, acá se fija el backend
# ozone de Chromium.
#
# El wrapper openSUSE (/etc/chromium/chromium.conf) detecta Wayland pero no
# fuerza el backend; confía en --ozone-platform-hint=auto, que en algunos
# arranques termina eligiendo X11 y muere sin X server.
CHROMIUM_USER_FLAGS=--ozone-platform=wayland
