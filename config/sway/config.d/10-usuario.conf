# Ajustes de usuario sobre la base openSUSEway.
# Se carga después de /etc/sway/config.d/* por el include del config principal.

### =========================
### Atajos de usuario
### =========================

# Lista los keybindings activos en una ventana tipo launcher (wofi).
# Ruta del repositorio: ajustar si se clona en otra ubicación.
bindsym $mod+Slash exec /home/jorge/Projects/dotfiles/scripts/wm-keybinds.sh

