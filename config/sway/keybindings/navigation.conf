# ----------------------------------------------------------------------------
# Atajos: navegación y manejo de ventanas
# ----------------------------------------------------------------------------
    # Mover/redimensionar flotantes: arrastrar con $mod+botón izq,
    # redimensionar con $mod+botón der.
    floating_modifier $mod normal

# --- Moverse y mover ventanas (hjkl + flechas) ---
    bindsym $mod+$left focus left
    bindsym $mod+$down focus down
    bindsym $mod+$up focus up
    bindsym $mod+$right focus right
    bindsym $mod+Left focus left
    bindsym $mod+Down focus down
    bindsym $mod+Up focus up
    bindsym $mod+Right focus right

    bindsym $mod+Shift+$left move left
    bindsym $mod+Shift+$down move down
    bindsym $mod+Shift+$up move up
    bindsym $mod+Shift+$right move right
    bindsym $mod+Shift+Left move left
    bindsym $mod+Shift+Down move down
    bindsym $mod+Shift+Up move up
    bindsym $mod+Shift+Right move right

# --- Layout ---
    # Dividir horizontal/vertical. --to-code: ata el bind a la tecla física
    # (no al símbolo), así no se rompe al cambiar de layout de teclado.
    bindsym --to-code {
        $mod+b splith
        $mod+v splitv
    }

    # Cambiar el layout del contenedor actual
    bindsym $mod+s layout stacking
    bindsym $mod+w layout tabbed
    bindsym $mod+e layout toggle split

    # Pantalla completa
    bindsym $mod+f fullscreen

    # Alternar la ventana enfocada entre empilado y flotante
    bindsym $mod+Shift+space floating toggle

    # Alternar el foco entre la zona flotante y la empilada
    bindsym $mod+space focus mode_toggle

    # Enfocar el contenedor padre
    bindsym $mod+a focus parent

# --- Scratchpad ---
    # Mover la ventana enfocada al scratchpad
    bindsym $mod+Shift+minus move scratchpad
    # Mostrar la siguiente ventana del scratchpad (o esconder la enfocada)
    bindsym $mod+minus scratchpad show
