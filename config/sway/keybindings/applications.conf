# ----------------------------------------------------------------------------
# Atajos: aplicaciones
# ----------------------------------------------------------------------------
    # Terminal
    bindsym $mod+Return exec $terminal

    # Cerrar la ventana enfocada
    bindsym $mod+Shift+q kill

    # Gestor de fondos de pantalla (azote, GUI para swaybg)
    bindsym $mod+Shift+w exec azote

    # Selector de color (hyprpicker): congela la pantalla, un click toma el
    # píxel, copia el hex en minúsculas al portapapeles y avisa con swaync.
    bindsym $mod+Shift+p exec hyprpicker -a -n -f hex -l
