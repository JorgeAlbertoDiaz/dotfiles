# ----------------------------------------------------------------------------
# Atajos: aplicaciones
# ----------------------------------------------------------------------------
    # Terminal
    bindsym $mod+Return exec $terminal

    # Cerrar la ventana enfocada
    bindsym $mod+Shift+q kill

    # Gestor de fondos de pantalla (azote, GUI para swaybg)
    bindsym $mod+Shift+w exec azote

    # Selector de color (hyprpicker): congela la pantalla, un click toma el
    # píxel, copia el hex en minúsculas al portapapeles y avisa con swaync.
    bindsym $mod+Shift+p exec hyprpicker -a -n -f hex -l

    # Dictado por voz (Handy): transcriptor local que escribe en la ventana
    # enfocada (ver docs/handy.md).
    # En Wayland el hotkey interno de Handy no puede capturar teclas de otras
    # apps: por eso el atajo vive acá y usa la CLI, que le avisa a la instancia
    # que ya está corriendo en la bandeja.
    bindsym $mod+Shift+d exec handy --toggle-transcription
