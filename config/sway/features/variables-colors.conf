# ----------------------------------------------------------------------------
# Variables centralizadas y colores — OpenDesk Sway
# ----------------------------------------------------------------------------
# Fuente única de verdad de TODAS las variables globales de la sesión: teclas,
# aplicaciones por acción, fuente y paleta de colores. Ningún otro módulo
# define variables globales; los que vienen después solo las consumen.
#
# Se incluye UNA sola vez, al principio, desde config/sway/config (antes de
# monitors/inputs/appearance/power). Un segundo include sería redundante y un
# include por módulo rompería el orden de definición.

# --- Teclas ---
# Modificador principal
set $mod Mod4

# Direcciones tipo vim (fila central)
set $left h
set $down j
set $up k
set $right l

# --- Fuente ---
# Definición única: appearance.conf la consume como
# "font pango:$font-family $font-size" y sway-font.sh edita estas dos líneas.
set $font-family JetBrainsMono Nerd Font
set $font-size 12

# --- Paleta de colores ---
# Paleta badwolf (sjl/badwolf): la misma que usa Neovim. Valores GUI exactos del
# colorscheme. Sobreescribí un valor acá y recargá con `swaymsg reload`.
set $color-primary #0a9dff
set $color-secondary #1c1b1a
set $color-accent #ffa724
set $color-teal #857f78
set $color-teal-light #d9cec3

# --- Colores de cliente ---
# SIN comillas a propósito: sway parte el valor en tokens al expandirlo y
# client.* exige 3 o 5 argumentos sueltos; entrecomillado contaría como uno solo.
# Formato sway: <border> <background> <text> [<indicator> <child_border>]
# El borde/indicador usa el mismo naranja (#ffa724) que el workspace activo de
# waybar, así foco de ventana y foco de workspace se leen iguales.
set $color-client-focused #ffa724 #1c1b1a #f8f6f2 #ffa724 #ffa724
set $color-client-unfocused #35322d #1c1b1a #998f84
set $color-client-focused-inactive #45413b #1c1b1a #857f78
set $color-client-urgent #ff2c4b #1c1b1a #f8f6f2

# --- Aplicaciones predeterminadas por acción ---
# (editar acá — recarga con `swaymsg reload`)
# Terminal
set $terminal foot
# Lanzador de aplicaciones (wofi lee ~/.config/wofi/ del repo)
set $launcher wofi
# Bloqueo de pantalla: usa ~/.config/swaylock/config del repo (que incluye la
# imagen de bloqueo). Sin flags, swaylock lee esa ruta por defecto.
set $screenlock swaylock
# OSD de volumen/brillo
set $wob wob --config /etc/sway/wob/wob.ini
# Navegador web
set $browser firefox
# Explorador de archivos
set $filemanager thunar
# Cliente de correo
set $mail thunderbird

# ----------------------------------------------------------------------------
# Ejemplo: abrir el navegador con $mod+b (descomentar para activar)
# bindsym $mod+b exec $browser
