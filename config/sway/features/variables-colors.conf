# ----------------------------------------------------------------------------
# Variables centralizadas — OpenDesk Sway
# ----------------------------------------------------------------------------
# Fuente única de verdad de las variables globales de la sesión: teclas,
# aplicaciones por acción y fuente. Ningún otro módulo define variables
# globales; los que vienen después solo las consumen.
#
# Los COLORES no viven acá: la paleta (y con ella los $color-client-*) es parte
# del tema claro/oscuro y está en config/sway/themes/{dark,light}.conf, que
# config/sway/config incluye ANTES de este archivo. Cambiar de tema es cambiar
# ese include (lo hace scripts/sway-theme.sh), no editar este archivo.
#
# Se incluye UNA sola vez, al principio, desde config/sway/config (antes de
# monitors/inputs/appearance/power). Un segundo include sería redundante y un
# include por módulo rompería el orden de definición.

# --- Teclas ---
# Modificador principal
set $mod Mod4

# Direcciones tipo vim (fila central)
set $left h
set $down j
set $up k
set $right l

# --- Fuente ---
# Definición única: appearance.conf la consume como
# "font pango:$font-family $font-size" y sway-font.sh edita estas dos líneas.
set $font-family JetBrainsMono Nerd Font
set $font-size 12

# --- Colores ---
# La paleta y los $color-client-* vienen del tema activo: ver el include
# themes/current.conf en config/sway/config y los archivos themes/*.conf.

# --- Aplicaciones predeterminadas por acción ---
# (editar acá — recarga con `swaymsg reload`)
# Terminal. $terminal NO es una terminal concreta sino el resolvedor: la terminal
# se elige en scripts/terminal.sh, porque waybar y swaync no pueden leer estas
# variables y necesitan el mismo default (ver el comentario de ese script).
set $terminal ~/.config/sway/scripts/terminal.sh
# Lanzador de aplicaciones (wofi lee ~/.config/wofi/ del repo)
set $launcher wofi
# Bloqueo de pantalla: usa la MISMA imagen que el fondo actual. El wrapper
# lee ~/.azotebg (lo que eligió azote) y cae a la imagen por defecto si no hay.
set $screenlock ~/.config/sway/scripts/swaylock-current.sh
# OSD de volumen/brillo
# OSD de volumen/brillo. El tema (claro/oscuro) lo elige sway-theme.sh: el
# ini es un enlace a config/wob/themes/{dark,light}.ini.
set $wob wob --config ~/.config/wob/wob.ini
# Navegador web
set $browser firefox
# Explorador de archivos
set $filemanager thunar
# Cliente de correo
set $mail thunderbird

# ----------------------------------------------------------------------------
# Ejemplo: abrir el navegador con $mod+b (descomentar para activar)
# bindsym $mod+b exec $browser
