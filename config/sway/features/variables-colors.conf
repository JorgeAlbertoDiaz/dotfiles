# ----------------------------------------------------------------------------
# Variables centralizadas y colores — OpenDesk Sway
# Único origen de verdad: todos los módulos deben incluir este archivo al
# principio para obtener $colormarco, $colorbg, $colorfg, $fontfamily, $fontsize
# ----------------------------------------------------------------------------

# Modificador principal
set $mod Mod4

# --- Fuente ---
set $font-family JetBrainsMono Nerd Font
set $font-size 12

# --- Paleta de colores (grupo "base") ---
# Puedes sobreescribir estos valores desde hosts/<tu-maquina>.conf si es necesario
set $color-primary #6da741
set $color-secondary #173f4f
set $color-foreground #d0d0d0
set $color-background #000000
set $color-accent #73ba25

# --- Colores de cliente (derived de la paleta) ---
# Estos se construyen a partir de $color-primary, $color-secondary, etc.
# formati: <color> <background> <foreground> <active/inactive> <border>
set $color-client-focused "${color-primary} ${color-background} ${color-primary} ${color-primary} ${color-accent}"
set $color-client-unfocused "${color-background} ${color-secondary} ${color-foreground}"
set $color-client-focused-inactive "${color-primary} ${color-secondary} ${color-secondary}"

# --- Aplicaciones predeterminadas por acción ---
# Sobreescribir desde hosts/<tu-maquina>.conf si es necesario
set $browser firefox
set $filemanager thunar
set $mail thunderbird
set $terminal foot
set $launcher wofi --conf=/etc/wofi/config --style=/etc/wofi/style.css
set $screenlock 'swaylock --config /etc/swaylock/openSUSEway.conf'
set $wob wob --config /etc/sway/wob/wob.ini
set $screenshot_dir "${HOME}/Pictures/Screenshots"

# --- Modos ---
set $mode-resize resize
set $mode-launcher launcher
set $mode-screenshot screenshot