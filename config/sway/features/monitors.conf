# ----------------------------------------------------------------------------
# Salida: wallpaper y monitores
# ----------------------------------------------------------------------------
# Wallpaper persistente: azote guarda su elección en ~/.azotebg y este exec la
# aplica en cada arranque (y recarga). Sin él, cae a la imagen por defecto.
# Se elige con GUI: $mod+Shift+w (azote).
exec sh -c 'if [ -x "$HOME/.azotebg" ]; then exec "$HOME/.azotebg"; else exec swaybg -i /usr/share/wallpapers/openSUSEdefault/contents/images/default-dark.png -m fill; fi'
# Monitores físicos (verificados con swaymsg -t get_outputs)
output HDMI-A-2 resolution 1920x1080 position 0,0
output HDMI-A-1 resolution 1920x1080 position 1920,0
