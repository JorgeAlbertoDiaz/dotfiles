# ----------------------------------------------------------------------------
# Espacios de trabajo
# ----------------------------------------------------------------------------
# Los atajos de espacio de trabajo (1-10) viven en
# keybindings/workspaces.conf.
#
# Reparto fijo entre los dos monitores del escritorio. Las posiciones salen de
# features/monitors.conf y son las que mandan:
#
#   HDMI-A-2   x=0      izquierda  →  workspaces 1-5
#   HDMI-A-1   x=1920   derecha    →  workspaces 6-10
#
# Ojo con los nombres: HDMI-A-1 NO es el de la izquierda, aunque lo parezca.
# Si se intercambian los cables (o se cambia el orden en monitors.conf), hay
# que intercambiar también estas líneas.
#
# `workspace <n> output <salida>` sólo asigna el workspace cuando se CREA (man
# 5 sway): sway las lee al arrancar, antes de que exista ninguno, así que desde
# ahí cada $mod+N abre o trae su workspace en su monitor. No reubica workspaces
# que ya existen: `swaymsg reload` no mueve ventanas ya abiertas, para eso está
# $mod+Shift+N.

# --- Mitad izquierda: HDMI-A-2 ---
workspace 1 output HDMI-A-2
workspace 2 output HDMI-A-2
workspace 3 output HDMI-A-2
workspace 4 output HDMI-A-2
workspace 5 output HDMI-A-2

# --- Mitad derecha: HDMI-A-1 ---
workspace 6 output HDMI-A-1
workspace 7 output HDMI-A-1
workspace 8 output HDMI-A-1
workspace 9 output HDMI-A-1
# $mod+0 en keybindings/workspaces.conf: "10" es el nombre y el número, y es
# el único caso donde la tecla no coincide con el número.
workspace 10 output HDMI-A-1

# --- Estado inicial de los dos monitores ---
# Al arrancar, sway crea un workspace por monitor tomando el primer nombre
# asignado a cada uno, así que la derecha abriría con el 6. El script cambia al
# 10 (lo crea en la derecha) y vuelve al 1, dejando el 1 enfocado y el 10 vivo
# a la derecha. `exec` y no `exec_always`: un reload no te mueve el foco.
exec ~/.config/sway/scripts/workspace-inicial.sh
