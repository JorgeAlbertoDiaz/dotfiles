# ----------------------------------------------------------------------------
# Autostart (se ejecuta en cada inicio de sesión)
# ----------------------------------------------------------------------------
exec_always {
    # Pasar el entorno del sistema a los servicios de usuario
    systemctl --user import-environment
    # Iconos y cursor: no dependen del tema claro/oscuro
    gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
    gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
    # FIFO para los avisos de volumen/brillo (wob). El guard con pgrep evita
    # apilar un par tail|wob por cada reload: sway NO mata los procesos de
    # exec_always al recargar, así que sin guard se acumulan compitiendo por el
    # mismo FIFO (se midieron 5 pares en una sesión). El toggle de tema mata el
    # par antes de recargar para que éste lo levante con el ini del tema activo.
    test -e $SWAYSOCK.wob || mkfifo $SWAYSOCK.wob
    pgrep -x wob >/dev/null || tail -f $SWAYSOCK.wob | $wob
}

# Tema claro/oscuro: re-aplica el último elegido. El script fija gtk-theme y
# color-scheme de las apps GTK/libadwaita, apunta los enlaces de los temas y
# reescribe initial-color-theme de foot. Es idempotente, así que corre también
# en cada `reload` sin costo. gtk-theme ya NO se fija acá a mano: hacerlo
# forzaba oscuro y rompía el modo claro.
exec_always ~/.config/sway/scripts/sway-theme.sh apply --quiet

# Centro de notificaciones: usa ~/.config/swaync/ del repo (tema del escritorio,
# sin agrupado por app). Sin flags, swaync lee esa ruta por defecto.
#
# Va con `exec` y no con `exec_always` a propósito: recargar sway no tiene por
# qué cerrar el panel, y el CSS se recarga en vivo con `swaync-client -rs`
# (lo hace el toggle de tema). Con exec_always, cada `reload` mataba y
# reiniciaba swaync.
exec swaync

# Agente de autenticación polkit (paquete polkit-gnome)
exec /usr/libexec/polkit-gnome-authentication-agent-1

# Historial de portapapeles (cliphist): guarda lo copiado (texto e imágenes).
# El guard usa -x wl-paste (nombre exacto del proceso) para no matchearse a sí
# mismo: `pgrep -f "cliphist store"` vería su propia línea de comando.
exec sh -c 'pgrep -x wl-paste >/dev/null || wl-paste --watch cliphist store'

# Dictado por voz (Handy): queda residente en la bandeja para que el atajo
# Super+Shift+d responda al instante. Arranca oculto y el guard evita errores
# ruidosos en máquinas donde todavía no está instalado (ver docs/handy.md).
exec sh -c 'command -v handy >/dev/null && handy --start-hidden'
