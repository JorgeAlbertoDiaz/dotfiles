# ----------------------------------------------------------------------------
# Autostart (se ejecuta en cada inicio de sesión)
# ----------------------------------------------------------------------------
exec_always {
    # Pasar el entorno del sistema a los servicios de usuario
    systemctl --user import-environment
    # Tema oscuro para apps GTK
    gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
    gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
    gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
    gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
    # FIFO para los avisos de volumen/brillo (wob)
    test -e $SWAYSOCK.wob || mkfifo $SWAYSOCK.wob
    tail -f $SWAYSOCK.wob | $wob
    # Centro de notificaciones: usa ~/.config/swaync/ del repo (badwolf, sin
    # agrupado por app). Sin flags, swaync lee esa ruta por defecto.
    swaync
}

# Agente de autenticación polkit (paquete polkit-gnome)
exec /usr/libexec/polkit-gnome-authentication-agent-1

# Historial de portapapeles (cliphist): guarda lo copiado (texto e imágenes).
# El guard usa -x wl-paste (nombre exacto del proceso) para no matchearse a sí
# mismo: `pgrep -f "cliphist store"` vería su propia línea de comando.
exec sh -c 'pgrep -x wl-paste >/dev/null || wl-paste --watch cliphist store'
