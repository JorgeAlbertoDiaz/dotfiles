# ----------------------------------------------------------------------------
# Portapapeles (clipboard)
# ----------------------------------------------------------------------------
# cliphist guarda el historial (texto e imágenes) vía el watcher de
# features/autostart.conf; scripts/clipboard.sh lo muestra en wofi y restaura la
# entrada elegida ($mod+Shift+v). Las capturas de imagen
# (features/screenshots.conf) se guardan en ~/Pictures/Screenshots y además se
# copian al portapapeles con wl-copy.
