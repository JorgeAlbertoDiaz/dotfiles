# ----------------------------------------------------------------------------
# Capturas de pantalla ($mod+Print) — menú wofi
# ----------------------------------------------------------------------------
# El menú (imagen y video) lo arma scripts/screenshot.sh: las imágenes van a
# ~/Pictures (guardadas Y copiadas al portapapeles) y el video a ~/Videos.
# Reemplaza al antiguo "mode" de Sway, que aparecía en la barra en inglés.
    bindsym $mod+Print exec ~/.config/sway/scripts/screenshot.sh
