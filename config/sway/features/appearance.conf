# ----------------------------------------------------------------------------
# Apariencia general
# ----------------------------------------------------------------------------
# Fuente (la personaliza config/sway/scripts/sway-font.sh: edita $font-family y
# $font-size donde estén definidas, no esta línea)
font pango:$font-family $font-size
# Bordes finos y espaciado (gaps los personaliza config/sway/scripts/sway-gaps.sh)
default_border pixel 2
gaps inner 10
# Colores de ventana (paleta openSUSE)
client.focused $color-client-focused
client.unfocused $color-client-unfocused
client.focused_inactive $color-client-focused-inactive

# ----------------------------------------------------------------------------
# Barra de estado
# ----------------------------------------------------------------------------
bar {
    swaybar_command waybar
}
