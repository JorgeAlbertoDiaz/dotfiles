# ----------------------------------------------------------------------------
# Tema CLARO (rust-light) — paleta y colores de cliente
# ----------------------------------------------------------------------------
# Este archivo lo elige scripts/sway-theme.sh. El include real vive en
# config/sway/config:
#
#   include themes/current.conf
#
# y themes/current.conf es un enlace simbólico a dark.conf o light.conf.
# `swaymsg reload` re-lee el include, así que el cambio de tema es en vivo.
#
# Solo paleta: las teclas, la fuente y las aplicaciones por acción viven en
# features/variables-colors.conf, que se incluye DESPUÉS y no define colores.
# No compongas variables a partir de otras ($color-client-* con "$color-acento"
# adentro): el orden de expansión de sway no lo garantiza. Escribí el valor.
#
# Fuente de la paleta: las variables CSS del tema `rust` de mdBook (modo claro).
# Los hsl() se materializan en hex porque sway solo acepta hex; el hex es el
# mismo valor:
#   --bg hsl(60,9%,87%) = #E1E1DB      --fg #262625
#   --sidebar-bg #3B2E2A  --sidebar-fg #C8C9DB  --sidebar-spacer #45373A
#   --sidebar-non-existant #505254     --sidebar-active #E69F67
#   --quote-bg hsl(60,5%,75%) = #C2C2BC  --quote-border hsl(60,5%,70%) = #B6B6AF
#   --table-header-bg #B3A497  --table-alternate-bg hsl(60,9%,84%) = #DADAD3
#   --theme-popup-border #B38F6B  --links #2B79A2  --inline-code-color #6E6B5E
#   --blockquote-caution-color #AA1721
#
# Roles: la barra y los paneles flotantes van con --sidebar-bg (chrome oscuro)
# y su texto con --sidebar-fg; las ventanas son el "documento" (--bg/--fg).

# --- Paleta ---
# primary   acento (--sidebar-active / --search-mark-bg)
# secondary panel atenuado del documento (--quote-bg)
# accent    enlaces e información (--links)
# teal      texto secundario del documento (--inline-code-color)
# teal-light texto sobre chrome oscuro (--sidebar-fg)
set $color-primary #E69F67
set $color-secondary #C2C2BC
set $color-accent #2B79A2
set $color-teal #6E6B5E
set $color-teal-light #C8C9DB

# --- Colores de cliente ---
# SIN comillas a propósito: sway parte el valor en tokens al expandirlo y
# client.* exige 3 o 5 argumentos sueltos; entrecomillado contaría como uno solo.
# Formato sway: <border> <background> <text> [<indicator> <child_border>]
# La ventana enfocada usa el chrome oscuro (#45373A, --sidebar-spacer) con su
# texto claro (#C8C9DB, --sidebar-fg) y borde acento: el foco se lee de un
# vistazo contra las ventanas sin foco, que quedan sobre el documento claro.
set $color-client-focused #E69F67 #45373A #C8C9DB #E69F67 #E69F67
set $color-client-unfocused #B6B6AF #DADAD3 #262625
set $color-client-focused-inactive #B38F6B #C2C2BC #262625
set $color-client-urgent #AA1721 #AA1721 #E1E1DB
