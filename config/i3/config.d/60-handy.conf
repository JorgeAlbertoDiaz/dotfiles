# ----------------------------------------------------------------------------
# Dictado por voz (Handy) — ver docs/handy.md
# ----------------------------------------------------------------------------
# /etc/i3/config no define $mod (usa "Mod1" literal en cada atajo), así que
# acá se define uno propio para este bloque. Mod4+Shift+d queda igual que en
# sway y no choca con los atajos Mod1 del paquete.
set $mod Mod4

# Inicia/detiene la transcripción y la escribe en la ventana enfocada.
# En X11 el hotkey interno de Handy también funciona, pero se prefiere el
# mismo camino que en sway: la CLI avisa a la instancia en la bandeja.
bindsym $mod+Shift+d exec --no-startup-id handy --toggle-transcription

# Residente en la bandeja desde el arranque (el guard evita errores si Handy
# todavía no está instalado).
exec --no-startup-id sh -c 'command -v handy >/dev/null && handy --start-hidden'
