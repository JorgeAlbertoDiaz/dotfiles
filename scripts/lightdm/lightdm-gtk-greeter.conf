# gestionado por dotfiles: scripts/15-setup-lightdm.sh (greeter rust-login)
#
# Greeter de LightDM con la paleta rust del escritorio. El instalador respalda
# este archivo antes de reemplazarlo (ver scripts/15-setup-lightdm.sh).
#
# background   @FONDO@ lo sustituye el instalador por la ruta real del fondo
#              (por defecto /etc/lightdm/background.png). El original editable
#              vive en el repo: scripts/lightdm/background.png
# theme-name   tema GTK3 en /usr/share/themes/rust-login (gtk.css -> dark|light)
# indicators   ~host se quitó a propósito: el nombre de la máquina no tiene por
#              qué estar a la vista de cualquiera que pase frente al login.

[greeter]
background=@FONDO@
theme-name=rust-login
icon-theme-name=Adwaita
font-name=JetBrainsMono Nerd Font 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~clock;~spacer;~language;~layout;~session;~a11y;~power
